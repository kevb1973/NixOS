# GENERAL
allow_remote_control yes
auto_reload_config 0.25
listen_on unix:@mykitty
shell fish
shell_integration enabled
font_size 14.0
editor nvim
scrollback_lines 10000
# window_margin_width 21.75
# window_padding_width 7
confirm_os_window_close 0
tab_bar_edge top
tab_bar_style fade
tab_powerline_style angled
enabled_layouts horizontal,stack

scrollback_pager nvim --clean -c "set number nolist showtabline=0 foldcolumn=0 laststatus=0 noshowmode noruler noshowcmd ignorecase smartcase incsearch shortmess+=F" -c "autocmd TermOpen * normal G" -c "map q :qa!<CR>" -c "set clipboard+=unnamedplus" -c "silent write! /tmp/kitty_scrollback_buffer | te echo -n \"$(cat /tmp/kitty_scrollback_buffer)\" && sleep 1000 "
# scrollback_pager nvim -c "set nonumber nolist showtabline=0 foldcolumn=0 laststatus=0 noshowmode noruler noshowcmd ignorecase smartcase incsearch shortmess+=F" -c "autocmd TermOpen * normal G" -c "map q :qa!<CR>" -c "set clipboard=unnamedplus" -c "silent write! /tmp/kitty_scrollback_buffer | te echo -n \"$(cat /tmp/kitty_scrollback_buffer)\" && sleep 1000 "

# scrollback_pager pipe-nvim.sh
notify_on_cmd_finish invisible 10
cursor_trail 1
# cursor_trail_decay 0.1 0.4
# cursor_trail_start_threshold 2
cursor_shape beam

# KEYBINDS
map alt+space>c             kitten hints --hints-background-color #dce0e8 --type word --program -
map alt+space>o             kitten hints --hints-background-color #dce0e8 --hints-foreground-color black
map alt+space>p             kitten hints --type=regex --regex='#(\d{6})' --program=open-nixpkgs-pr
# map ctrl+alt+up             launch --cwd=current --type=overlay vifm
# map ctrl+alt+up             launch --cwd=current --type=overlay nnn-kitty-overlay
# map alt+space>e             launch --cwd=current --type=tab nvim
# map alt+space>j             launch --cwd=current --type=tab jjui
# map alt+space>t>t           new_tab
# map alt+space>t>d           close_tab
# map alt+space>t>r           set_tab_title
# map alt+space>w>w           new_window
# map alt+space>w>d           close_window
# map alt+space>s             show_scrollback
# map alt+space>left          previous_window
# map alt+space>right         next_window
# map alt+space>space         launch --allow-remote-control --type=window kitty-switch-tab

map alt+up                  scroll_page_up
map alt+down                scroll_page_down
map kitty_mod+KP_END        goto_tab 1
map kitty_mod+KP_DOWN       goto_tab 2
map kitty_mod+KP_PAGE_DOWN  goto_tab 3
map kitty_mod+KP_LEFT       goto_tab 4
map kitty_mod+KP_BEGIN      goto_tab 5
map kitty_mod+KP_RIGHT      goto_tab 6
map kitty_mod+KP_HOME       goto_tab 7
map kitty_mod+KP_UP         goto_tab 8
map kitty_mod+KP_PAGE_UP    goto_tab 9
map kitty_mod+KP_INSERT     goto_tab 10
map kitty_mod+up            next_window
map kitty_mod+down          previous_window
map kitty_mod+k             command_palette
map kitty_mod+z             toggle_layout stack
map ctrl+alt+shift+right    move_tab_forward
map ctrl+alt+shift+left     move_tab_backward

# Disable Unicode input shortcut.. need for rmpc library update
map ctrl+shift+u  no_op
map ctrl+u        no_op

# Install hinted app from nix-search into user profile
# This one works with nix-search-cli
# map kitty_mod+i         kitten hints --hints-background-color #dce0e8 --type=regex --regex='(?m)(^[a-zA-Z0-9]\s).*' --program 'launch /home/kev/.local/bin/kitty-npi'
# This one works with nh search...
# map alt+space>i         kitten hints --hints-background-color #dce0e8 --type=regex --regex='(?m)(^[\S]+)' --program 'launch kitty-npi'
# map alt+space>t         kitten hints --hints-background-color #dce0e8 --type=regex --regex='(?m)(^[\S]+)' --program 'launch --type=tab --tab-title '<nix-shell>' kitty-ns'

# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# include themes/noctalia.conf
include themes/noctalia.conf
