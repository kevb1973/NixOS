bind=SUPER+SHIFT,q,quit

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,Return,              spawn,kitty
bind=SUPER,z,                   spawn,vicinae toggle
bind=SUPER+SHIFT,Return,        spawn,nautilus
bind=SUPER+SHIFT,x,             killclient
bind=Super,s,                   spawn,gscreenshot -c -s
bind=Super+Shift,s,             spawn,gscreenshot -s
bind=SUPER+SHIFT,s,             spawn_shell,hyprshot -m region -s -r --clipboard-only | satty -f -

# tools
bind=NONE,F10,                  spawn_shell,wlrctl pointer move 2560 1440
bind=SUPER,KP_Divide,           spawn,mmsg -d toggle_monitor
bind=SUPER,e,                   spawn,vicinae vicinae://launch/core/search-emojis
bind=SUPER,n,                   spawn,kitty --app-id=remind_tui remind_tui
bind=SUPER+SHIFT,c,             spawn,cliphist wipe
bind=SUPER,t                    spawn,kitty --detach clock-rs stopwatch
# bind=HYPER,m,                   spawn,play_yt.sh
bind=SUPER+SHIFT,Space,         spawn,wl-kbptr -o modes=floating -o mode_floating.source=detect
bind=SUPER,SPACE,               spawn_shell,wl-kbptr -o modes=floating,click -o mode_floating.source=detect && wlrctl pointer move 2560 -1440
# bind=SUPER+Control,Space,       spawn,wl-kbptr -o modes=floating,click -o mode_floating.source=detect -o mode_click.button=right

# Keyboard "click hints" like vimium
bind=SUPER+SHIFT,z,             spawn,kb_move


# switch layout
bind=CTRL+SUPER+SHIFT,i,        setlayout,fair
bind=CTRL+SUPER+SHIFT,l,        setlayout,scroller
bind=SUPER,bracketright,        switch_layout
bind=SUPER+SHIFT,d              dwindle_toggle_split_direction

# switch window focus
bind=SUPER,Left,                focusdir,left
bind=SUPER,Right,               focusdir,right
bind=SUPER,Up,                  focusdir,up
bind=SUPER,Down,                focusdir,down

# Scratchpad
bind=SUPER,grave,               toggle_scratchpad
bind=SUPER+SHIFT,grave,         minimized

# Named Scratchpads
bind=SUPER,KP_1,                toggle_named_scratchpad,kitty-session,none,kitty --app-id=kitty-session --session ~/.config/kitty/default.kitty-session
bind=SUPER,KP_2,                toggle_named_scratchpad,neovide,none,neovide --chdir ~/NixOS
bind=SUPER,KP_Multiply,         toggle_named_scratchpad,qalculate-gtk,none,qalculate-gtk

# swap window
bind=SUPER+SHIFT,Left,          exchange_client,left
bind=SUPER+SHIFT,Down,          exchange_client,down
bind=SUPER+SHIFT,Up,            exchange_client,up
bind=SUPER+SHIFT,Right,         exchange_client,right

# resize window
bind=SUPER,equal,               resizewin,+50,+0
bind=SUPER,minus,               resizewin,-50,+0
# bind=HYPER,left,                resizewin,-5,+0
# bind=HYPER,right,               resizewin,+5,+0
# bind=HYPER,up,                  resizewin,+0,-5
# bind=HYPER,down,                resizewin,-,+5
# bind=HYPER+SHIFT,left,          movewin,-5,+0 # +
# bind=HYPER+SHIFT,right,         movewin,+5,+0 # -
# bind=HYPER+SHIFT,up,            movewin,+0,-5 # +
# bind=HYPER+SHIFT,down,          movewin,-,+5 # -
# bind=HYPER+ALT,up,              resizewin,+5,+5
# bind=HYPER+ALT,down,            resizewin,-5,-5 
# bind=SUPER+SHIFT,equal,       resizewin,+0,+50
# bind=SUPER+SHIFT,minus,       resizewin,+0,-50
bind=SUPER,r,                   switch_proportion_preset

# axis binds
axisbind=SUPER+SHIFT+CTRL,Up,   exchange_client,left
axisbind=SUPER+SHIFT+CTRL,Down, exchange_client,right
axisbind=SUPER+SHIFT,Up,        focusstack,prev
axisbind=SUPER+SHIFT,Down,      focusstack,next
axisbind=SUPER,Up,              viewtoleft,0
axisbind=SUPER,Down,            viewtoright,0

# switch window status
bind=SUPER+CTRL,space,          togglefloating
bind=SUPER,g,                   toggleglobal
bind=SUPER,Tab,                 toggleoverview
bind=SUPER,BackSpace,           togglemaximizescreen
bind=SUPER,backslash,           togglefakefullscreen
bind=SUPER,f,                   togglefullscreen

# audio controls
# bind=none,XF86AudioPrev,      spawn,playerctl previous
# bind=none,XF86AudioPlay,      spawn,playerctl play-pause
# bind=none,XF86AudioNext,      spawn,playerctl next

# switch tag
bind=SUPER+ALT,Up,              viewtoleft,0
bind=SUPER+ALT,Down,            viewtoright,0

# Can't use KP_ here as it conflicts with other binds
bind=SUPER,1,                   view,1,0
bind=SUPER,2,                   view,2,0
bind=SUPER,3,                   view,3,0
bind=SUPER,4,                   view,4,0
bind=SUPER,5,                   view,5,0
bind=SUPER,6,                   view,6,0
bind=SUPER,7,                   view,7,0
bind=SUPER,8,                   view,8,0
bind=SUPER,9,                   view,9,0

bind=SUPER+SHIFT,1,             tag,1,0
bind=SUPER+SHIFT,2,             tag,2,0
bind=SUPER+SHIFT,3,             tag,3,0
bind=SUPER+SHIFT,4,             tag,4,0
bind=SUPER+SHIFT,5,             tag,5,0
bind=SUPER+SHIFT,6,             tag,6,0
bind=SUPER+SHIFT,7,             tag,7,0
bind=SUPER+SHIFT,8,             tag,8,0
bind=SUPER+SHIFT,9,             tag,9,0

bind=SUPER+CTRL,1,              toggletag,1
bind=SUPER+CTRL,2,              toggletag,2
bind=SUPER+CTRL,3,              toggletag,3
bind=SUPER+CTRL,4,              toggletag,4
bind=SUPER+CTRL,5,              toggletag,5
bind=SUPER+CTRL,6,              toggletag,6
bind=SUPER+CTRL,7,              toggletag,7
bind=SUPER+CTRL,8,              toggletag,8
bind=SUPER+CTRL,9,              toggletag,9

bind=SUPER+SHIFT+CTRL,1,        toggleview,1
bind=SUPER+SHIFT+CTRL,2,        toggleview,2
bind=SUPER+SHIFT+CTRL,3,        toggleview,3
bind=SUPER+SHIFT+CTRL,4,        toggleview,4
bind=SUPER+SHIFT+CTRL,5,        toggleview,5
bind=SUPER+SHIFT+CTRL,6,        toggleview,6
bind=SUPER+SHIFT+CTRL,7,        toggleview,7
bind=SUPER+SHIFT+CTRL,8,        toggleview,8
bind=SUPER+SHIFT+CTRL,9,        toggleview,9

# mousebind=NONE,btn_left,      toggleoverview,-1
# mousebind=NONE,btn_right,     togglemaximizescreen,0
# mousebind=NONE,btn_middle,    killclient,0

# Window manipulation
mousebind=SUPER,btn_left,       moveresize,curmove
mousebind=SUPER,btn_right,      moveresize,curresize
mousebind=SUPER+CTRL,btn_right, killclient

# Overview mode (requires NONE modifier)
# mousebind=NONE,btn_left,      toggleoverview,-1
# mousebind=NONE,btn_right,     killclient,0
# mousebind=NONE,btn_middle,    togglemaximizescreen,0

gesturebind=none,right,3,       focusdir,left
gesturebind=none,left,3,        focusdir,right
gesturebind=none,down,3,        viewtoleft_have_client
gesturebind=none,up,3,          viewtoright_have_client
gesturebind=none,up,4,          toggleoverview
gesturebind=none,down,4,        toggleoverview

# Media Controls

bind=Super,code:79,spawn,       playerctl play-pause
bind=Super,KP_Up,spawn,         playerctl previous
bind=Super,KP_Prior,spawn,      playerctl next
bind=Super,KP_Begin,spawn,      playerctld shift
bind=Super,KP_Right,spawn,      playerctld unshift

# Lgtv
bind=SUPER,Delete,              spawn,lgtv system turnOff
bind=SUPER+SHIFT,Delete,        spawn,lgtv wakeonlan
bind=SUPER,Prior,               spawn,lgtv audio setMute true
bind=SUPER+SHIFT,Prior,         spawn,lgtv audio setMute false
bind=SUPER,Next,                spawn,lgtv audio volumeDown
bind=SUPER+SHIFT,Next,          spawn,lgtv audio volumeUp
