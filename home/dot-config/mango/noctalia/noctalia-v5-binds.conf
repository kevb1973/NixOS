
# General
bind=SUPER,b,                     spawn,noctalia msg bar-toggle
bind=SUPER,m,                     spawn,noctalia msg panel-toggle control-center media
bind=SUPER,P,                     spawn,noctalia msg panel-toggle launcher /wall
bind=SUPER+Shift,P,               spawn,noctalia msg wallpaper-set color:#15212f
bind=SUPER,w,                     spawn,noctalia msg panel-toggle control-center weather 
bind=SUPER,q,                     spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,m,               spawn,noctalia msg panel-toggle control-center system
bind=SUPER,c,                     spawn,noctalia msg panel-toggle clipboard
bind=SUPER+SHIFT,c,               spawn,noctalia msg clipboard-clear

# Launcher
# bind=SUPER,e,                     spawn,noctalia msg panel-toggle launcher /emo 
bind=SUPER,KP_Enter,              spawn,noctalia msg panel-toggle launcher

# Notifications
bind=SUPER,a,                     spawn,noctalia msg panel-toggle control-center notifications
# bind=SUPER+Control+Shift,a,       spawn,noctalia msg notifications clear
bind=SUPER+SHIFT,a,               spawn,noctalia msg notification-clear-history
bind=SUPER,d,                     spawn,noctalia msg notification-clear-active

# Timer
# bind=SUPER,t,                     spawn,noctalia msg plugin:timer toggle
bind=SUPER,t,                     spawn,kitty clock-rs stopwatch
# bind=SUPER+Control,t,             spawn,noctalia msg plugin:timer start stopwatch
# bind=SUPER+Shift,t,               spawn,noctalia msg plugin:timer reset

# Media
bind=none,XF86AudioLowerVolume,   spawn,noctalia msg volume-down 1
bind=none,XF86AudioMute,          spawn,noctalia msg volume-mute
bind=none,XF86AudioRaiseVolume,   spawn,noctalia msg volume-up 1

