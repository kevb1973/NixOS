[[bind.default]]
"SUPER+b"              = "spawn,noctalia msg bar-toggle"
"SUPER+m"              = "spawn,noctalia msg panel-toggle control-center media"
"SUPER+P"              = "spawn,noctalia msg panel-toggle launcher /wall"
"SUPER+Shift+P"        = "spawn,noctalia msg wallpaper-set color:#15212f"
"Super+s"              = "spawn,noctalia msg screenshot-region"
"SUPER+w"              = "spawn,noctalia msg panel-toggle control-center weather"
"SUPER+SHIFT+w"        = "spawn,noctalia msg panel-toggle control-center calendar"
"SUPER+q"              = "spawn,noctalia msg panel-toggle session"
"SUPER+period"         = "spawn,noctalia msg settings-toggle"
"SUPER+SHIFT+m"        = "spawn,noctalia msg panel-toggle control-center system"
"SUPER+SHIFT+n"        = "spawn,noctalia msg panel-toggle noctalia/notes:panel"
"SUPER+c"              = "spawn,noctalia msg panel-toggle clipboard"
"SUPER+u"              = "spawn,noctalia msg panel-toggle avivbintangaringga/nix-monitor:panel"
"SUPER+SHIFT+c"        = "spawn,noctalia msg clipboard-clear"
"SUPER+SHIFT+t"        = "spawn,noctalia msg theme-mode-toggle"
"SUPER+KP_Multiply"    = "spawn,noctalia msg panel-toggle samuelskovbakke/calculator-plus:panel"
"SUPER+Tab"            = "spawn,noctalia msg window-switcher"
"SUPER+z"              = "spawn,noctalia msg panel-toggle launcher"
"SUPER+SHIFT+z"        = "spawn,noctalia-script-launcher"
"SUPER+a"              = "spawn,noctalia msg panel-toggle control-center notifications"
"SUPER+SHIFT+a"        = "spawn,noctalia msg notification-clear-history"
"SUPER+d"              = "spawn,noctalia msg notification-clear-active"
"SUPER+t"              = "spawn,kitty clock-rs stopwatch"
"XF86AudioLowerVolume" = "spawn,noctalia msg volume-down 1"
"XF86AudioMute"        = "spawn,noctalia msg volume-mute"
"XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up 1"
"SUPER+KP_7"           = "spawn, noctalia msg media toggle"
"SUPER+KP_8"           = "spawn, noctalia msg media previous"
"SUPER+KP_9"           = "spawn, noctalia msg media next"
