[[bind.default]]
"CTRL+ALT+Delete"      = "spawn,dms ipc call processlist toggle"
"SUPER+P"              = "spawn,dms ipc call dankdash wallpaper"
"SUPER+SHIFT+n"        = "spawn,dms ipc call notepad toggle"
"SUPER+SHIFT+t"        = "spawn,kitty set_timer"
"SUPER+a"              = "spawn,dms ipc call notifications toggle"
"SUPER+b"              = "spawn,dms ipc call bar toggleAutoHide index 0"
"SUPER+c"              = "spawn,dms ipc call clipboard toggle"
"SUPER+d"              = "spawn,dms ipc call notifications dismissAllPopups"
"SUPER+e"              = "spawn,dms ipc call launcher toggleQuery ':e '"
"SUPER+m"              = "spawn,dms ipc call dash toggle media"
"SUPER+q"              = "spawn,dms ipc call powermenu toggle"
"SUPER+s"              = "spawn,dms screenshot region"
"SUPER+t"              = "spawn,kitty clock-rs stopwatch"
"SUPER+w"              = "spawn,dms ipc call dash toggle weather"
"SUPER+z"              = "spawn,dms ipc call spotlight toggle"
"SUPER+SHIFT+z"        = "spawn,dms-script-launcher"
"XF86AudioLowerVolume" = "spawn,dms ipc call audio decrement 1"
"XF86AudioMute"        = "spawn,dms ipc call audio mute"
"XF86AudioRaiseVolume" = "spawn,dms ipc call audio increment 1"
"SUPER+KP_7"           = "spawn, dms ipc call mpris playPause"
"SUPER+KP_8"           = "spawn, dms ipc call mpris previous"
"SUPER+KP_9"           = "spawn, dms ipc call mpris next"
